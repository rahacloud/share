<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>RahaCloud Share</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <h1>RahaCloud Share</h1>

    <section id="loading">
      <p class="muted">Decrypting…</p>
    </section>

    <section id="ready" hidden>
      <p>Someone shared a secret with you. It is decrypted in this browser; the key never leaves it.</p>
      <div class="secret">
        <pre id="secret" class="concealed"></pre>
      </div>
      <div class="actions">
        <button id="reveal" type="button">Reveal</button>
        <button id="copy" type="button">Copy</button>
      </div>
      <p class="muted">Store it somewhere safe and close this tab. Links expire after a few days.</p>
    </section>

    <section id="error" hidden>
      <p id="error-message"></p>
    </section>
  </main>
</body>
</html>
